name: Buffett screener (S&P 500 + Nasdaq-100)

on:
  schedule:
    - cron: "17 3 * * 6"   # ทุกวันเสาร์ 10:17 เวลาไทย
  workflow_dispatch:
    inputs:
      list_only:
        description: "แค่ตรวจรายชื่อหุ้น (ไม่สแกน ไม่บันทึก)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt lxml

      - name: Run screener
        run: python screener.py ${{ inputs.list_only && '--list-only' || '' }}

      - name: Save results to repo
        if: ${{ !inputs.list_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screener.csv
          if [ -f buffett_indicator.csv ]; then git add buffett_indicator.csv; fi
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Buffett screener results"
          git pull --rebase origin main
          git push
